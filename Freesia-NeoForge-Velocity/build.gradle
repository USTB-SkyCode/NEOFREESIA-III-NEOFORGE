plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'com.nguyendevs.freesia'
// Keep in sync with src/main/resources/velocity-plugin.json.
version = '1.0.3-diagnostic'

base {
    archivesName = 'Freesia-NeoForge-Velocity'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.opencollab.dev/maven-releases/' }
    maven { url = 'https://repo.opencollab.dev/maven-snapshots/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
}

dependencies {
    // Provided by Velocity at runtime.
    compileOnly 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    compileOnly 'io.netty:netty-all:4.1.115.Final'
    compileOnly 'org.slf4j:slf4j-api:2.0.13'
    // PacketEvents (separate Velocity plugin) — used to observe backend entity packets.
    // 1.0.3-diagnostic is built against 2.13.0 (the version deployed alongside it).
    compileOnly 'com.github.retrooper:packetevents-velocity:2.13.0'

    // Bundled: MCPRotocolLib lets the proxy connect to the Worker as a vanilla fake client.
    implementation 'org.geysermc.mcprotocollib:protocol:1.21-SNAPSHOT'

    // Bundled: TOML config parser.
    implementation 'com.electronwill.night-config:toml:3.6.6'

    // Normally provided by Velocity at runtime; the offline regression suite needs them on the
    // test classpath because `compileOnly` dependencies are not part of testRuntimeClasspath.
    testImplementation 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    testImplementation 'org.slf4j:slf4j-api:2.0.13'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

shadowJar {
    archiveClassifier = ''
    mergeServiceFiles()
}

// shadowJar 的 classifier 是空串，而普通 jar 的 classifier 默认也是空串，
// 于是两者都会写出 Freesia-NeoForge-Velocity-<version>.jar —— 谁后执行谁覆盖。
// 也就是说「未打包依赖的薄 jar 覆盖掉 shaded jar」是可能发生的，
// 而这个错误会一路潜伏到部署时才以 NoClassDefFoundError 爆出来。
// 给薄 jar 一个显式 classifier，让两个产物档名不再相等（保持 jar 任务可用，
// 避免影响 shadowJar 自身的任务图）。
tasks.named('jar') {
    archiveClassifier = 'thin'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

// ---------------------------------------------------------------------------
// Regression suite
// ---------------------------------------------------------------------------
// SwitchRegressionTest is a plain `main()` program (no JUnit dependency): it drives the real
// MapperManager / YsmPacketProxy through in-memory Velocity interface stubs. Run it with
// `gradlew regressionTest`; `gradlew check` depends on it.
tasks.named('test') {
    // No JUnit test sources in this project; the suite below is the actual verification entry point.
    enabled = false
}

tasks.register('regressionTest', JavaExec) {
    group = 'verification'
    description = 'Runs SwitchRegressionTest against the compiled plugin classes.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'SwitchRegressionTest'
}

tasks.named('check') {
    dependsOn tasks.named('regressionTest')
}
